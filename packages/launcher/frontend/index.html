<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VaKao Hub</title>
    <script>
      (function () {
        try {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
          var saved = localStorage.getItem('vakaohub-theme');
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <style>
      :root {
        --splash-bg: #f3f1ec;
        --splash-raised: #faf9f5;
        --splash-ink: #171512;
        --splash-muted: #8c877d;
        --splash-line: rgba(23, 21, 18, 0.12);
        --splash-accent: #46a6c6;
      }

      [data-theme='dark'] {
        --splash-bg: #121210;
        --splash-raised: #1b1a17;
        --splash-ink: #f2efe7;
        --splash-muted: #807a6e;
        --splash-line: rgba(242, 239, 231, 0.14);
        --splash-accent: #6fc7e3;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--splash-bg);
      }

      body {
        overflow: hidden;
      }

      #vakao-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
        color: var(--splash-ink);
        opacity: 1;
        visibility: visible;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }

      #vakao-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-glow {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 36% 34%, rgba(240, 153, 95, 0.16), transparent 42%),
          radial-gradient(circle at 66% 38%, rgba(95, 190, 220, 0.16), transparent 44%),
          radial-gradient(circle at 50% 68%, rgba(162, 127, 194, 0.14), transparent 46%);
        filter: blur(22px);
        animation: splash-breathe 1.8s ease-in-out infinite;
      }

      .splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: splash-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .splash-star {
        width: 88px;
        height: 88px;
        display: block;
      }

      .splash-word {
        margin-top: 20px;
        font-family: 'Archivo', 'PingFang SC', 'Noto Sans SC', sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .splash-word b {
        color: var(--splash-muted);
        font-weight: 500;
      }

      .splash-sub {
        margin: 5px 0 0;
        color: var(--splash-muted);
        font-family: 'SF Mono', 'Menlo', monospace;
        font-size: 8px;
        letter-spacing: 0.18em;
      }

      .splash-track {
        width: 148px;
        height: 2px;
        margin-top: 30px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--splash-line);
      }

      .splash-track span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: var(--splash-accent);
        animation: splash-slide 1.4s ease-in-out infinite;
      }

      .splash-caption {
        margin: 13px 0 0;
        color: var(--splash-muted);
        font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', sans-serif;
        font-size: 10px;
        letter-spacing: 0.02em;
      }

      @keyframes splash-in {
        from { opacity: 0; transform: translateY(8px) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes splash-breathe {
        0%, 100% { opacity: 0.55; transform: scale(0.94); }
        50% { opacity: 1; transform: scale(1.04); }
      }

      @keyframes splash-slide {
        0% { transform: translateX(-120%); }
        55%, 100% { transform: translateX(340%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-glow,
        .splash-content,
        .splash-track span {
          animation: none;
        }
      }
    </style>
</head>
<body>
<div id="vakao-splash" aria-hidden="true">
    <div class="splash-glow"></div>
    <div class="splash-content">
        <img class="splash-star" src="/star-spin.svg" alt="" />
        <div class="splash-word">VaKao <b>Hub</b></div>
        <p class="splash-sub">SOFTWARE SUITE</p>
        <div class="splash-track"><span></span></div>
        <p class="splash-caption">正在整理软件目录</p>
    </div>
</div>
<div id="app"></div>
<script>
  (function () {
    var splash = document.getElementById('vakao-splash');
    var hidden = false;

    window.__vakaoHideSplash = function () {
      if (hidden || !splash) return;
      hidden = true;
      splash.classList.add('is-hidden');
      window.setTimeout(function () {
        splash.remove();
      }, 460);
    };

    window.setTimeout(window.__vakaoHideSplash, 5000);
  })();
</script>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
